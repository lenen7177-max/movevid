<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111114" />
    <title>You're offline</title>
    <style>
      :root {
        color: #f5f5f7;
        background: #111114;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      p {
        margin: 0.75rem 0 1.5rem;
        color: #8e8e93;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        border-radius: 0.5rem;
        padding: 0.625rem 1rem;
        color: #ffffff;
        background: #3d5afe;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Reconnect to the internet to load the latest account information.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
