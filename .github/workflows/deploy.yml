# Deploys MoveVid to Cloudflare on every push to main (and on demand from the Actions tab).
# One-time setup in GitHub → Settings → Secrets and variables → Actions → New repository secret:
#   CLOUDFLARE_API_TOKEN  a Cloudflare API token that can edit Workers and D1
# Worker secrets (APIMart, Stripe, Resend…) live on the workers in Cloudflare, not here.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # the IndexNow step commits apps/web/indexnow-sent.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 4496a3f3635f477d6bb25ad643688a53
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Public by design: the site serves it at /<key>.txt for IndexNow.
      INDEXNOW_KEY: 6ea4844497bb1c4e945289350319fc78
    steps:
      - name: Stop when the Cloudflare token is not set yet
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret, then re-run this workflow."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:placeholders
      - name: Migrate D1
        # pnpm runs it directly: turbo's strict env mode would hide the Cloudflare variables.
        run: pnpm -F server db:migrate
      - name: Deploy API worker
        run: pnpm deploy:server
      - name: Deploy web worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm deploy:web
      - name: Push the IndexNow record
        run: git push origin HEAD:main || true
